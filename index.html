:root{--bg:#050505;--pn:#0E0E0E;--fg:#FFFFFF;--rd:#E10600;--dr:#6E0A0A;--ln:#d6d6d0;--mu:#a0a09c;--gl:rgba(255,255,255,.3)}
body.lt{--bg:#F2F2ED;--pn:#EDEDE8;--fg:#0A0A0A;--ln:#0A0A0A;--mu:#555;--gl:rgba(0,0,0,.2)}
.blk{--bg:#0E0E0E;--pn:#0E0E0E;--fg:#fff;--ln:#d6d6d0;--mu:#a0a09c;--gl:rgba(255,255,255,.3);background-color:#0E0E0E!important;color:#fff}
.inv{--bg:#EDEDE8;--pn:#EDEDE8;--fg:#0A0A0A;--ln:#0A0A0A;--mu:#555;--gl:rgba(0,0,0,.2);background-color:#EDEDE8!important;color:#0A0A0A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-synthesis:none}html[lang=fa]{font-family:Abar,Helv,system-ui,sans-serif}html[lang=en]{font-family:Helv,Abar,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--fg);font-size:17px;line-height:1.7;padding:env(safe-area-inset-top) 0 0}
#app{max-width:560px;margin:auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:.3em 0;font-weight:700}h1{font-size:46px;line-height:1.2}h2{font-size:30px;line-height:1.3}
h3{font-size:17px;display:inline-block;border-bottom:2px solid var(--rd);margin:.6em 0 .3em}
h1,h2,.big,.tm,.stamp,.sosb span{filter:url(#ero);-webkit-mask-image:radial-gradient(circle at center,#000 0 .95px,transparent 1.15px);-webkit-mask-size:2px 2px;mask-image:radial-gradient(circle at center,#000 0 .95px,transparent 1.15px);mask-size:2px 2px}
body.lt h1,body.lt h2,.inv h2,.inv h1{color:var(--rd)}.blk h1,.blk h2{color:#fff}
html[lang=en] h1,html[lang=en] h2,html[lang=en] .big,html[lang=en] .stamp{text-transform:uppercase;letter-spacing:.12em}
.lb{display:flex;flex-direction:column;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;margin:4px 0 10px;direction:ltr;align-items:flex-start}
html[dir=rtl] .lb{align-items:flex-end}html[lang=en] .lb span:first-child{text-transform:uppercase;letter-spacing:.1em}html[lang=fa] .lb span:first-child{font-family:Abar;font-size:13px}
.lb span:first-child{border-bottom:2px solid var(--rd);padding:0 0 1px;display:inline-flex;gap:6px;align-items:center}.lb span:first-child::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--rd)}.xy{color:var(--mu);direction:ltr}
.top{display:flex;justify-content:space-between;align-items:center}
.card,.sp{background-color:var(--pn);background-image:radial-gradient(rgba(128,128,128,.22) 1px,transparent 1.2px);background-size:7px 7px;border:1px solid var(--ln);border-radius:2px;padding:16px;margin:12px 0}
.split{margin:12px 0;border:1px solid var(--ln)}.split .sp{margin:0;border:0;border-radius:0}.split .sp+.sp{border-top:1px solid var(--ln)}
.c{text-align:center}.big{font-size:52px;font-weight:700;direction:ltr;color:var(--rd);line-height:1.3}.big small{font-size:14px;color:var(--fg);margin:0 4px 0 8px}
.lab,.sub,.note{color:var(--mu);font-size:14px}.note{text-align:center;margin:18px 4px}
.sosb{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:96px;border:3px solid var(--rd);border-radius:2px;background:#050505;color:var(--rd);font:inherit;font-size:34px;font-weight:700;margin:8px 0}
.btn{flex:1;min-height:54px;border-radius:2px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font:inherit;font-size:16px;padding:8px 12px;margin:4px 0;width:100%}
.btn.pri{border:2px solid var(--rd);color:var(--rd);font-weight:700}.btn.sm{min-height:42px;width:auto;padding:4px 14px}
.row{display:flex;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font-size:14px;color:var(--mu)}.g2 b{display:block;font-size:20px;color:var(--fg)}

a3t:['محیط را طراحی کن، نه اراده را','Design the environment instead of fighting willpower'],a3b:['اراده مثل باتری است و آخر شب خالی می‌شود. پس قبل از لحظهٔ میل، محیط را بساز: شارژر بیرون اتاق، فیلتر محتوا، حساب‌های محرک بی‌صدا یا حذف‌شده. کار سخت را به عصر امروز بسپار تا شب ساده باشد.','Willpower is like a battery that is empty late at night. Shape the environment before the urge arrives: charger outside the bedroom, content filters, triggering accounts muted or removed. Do the hard work in the afternoon so the night is easy.'],
a4t:['ده ثانیهٔ اول چه کنم','What to do in the first 10 seconds'],a4b:['صفحه را ببند، گوشی را قفل کن، بلند شو و جایت را عوض کن. بعد آب سرد به صورتت بزن. حرکت بدن زنجیرهٔ عادت را پیش از شروع فکر کردن قطع می‌کند.','Close the screen, lock the phone, stand up and change location. Then splash cold water on your face. Moving the body breaks the habit chain before the thinking starts.'],
a5t:['کسالت و تنهایی شبیه میل‌اند','How boredom and loneliness imitate desire'],a5b:['گاهی آنچه حس می‌کنی میل نیست؛ کسالت، تنهایی یا استرس است که دنبال تسکین سریع می‌گردد. از خودت بپرس: الان واقعاً چه نیازی دارم؟ استراحت، آدم، حرکت یا غذا؟ پاسخ به نیاز اصلی، میل را کم می‌کند.','Sometimes what you feel is not desire but boredom, loneliness or stress looking for quick relief. Ask: what do I actually need right now? Rest, people, movement, food? Meeting the real need often lowers the urge.'],
a6t:['چرا یک لغزش به ولگردی تبدیل می‌شود','Why one slip becomes a binge'],a6b:['پس از یک لغزش، فکر «همه‌چیز خراب شد» شدت می‌گیرد؛ پژوهشگران به آن اثر نقض پرهیز می‌گویند. راه شکستنش مهربانی و شروع فوری است: لغزش را ثبت کن، یاد بگیر و همین الان دوباره شروع کن.','After a slip, the thought "everything is ruined" grows; researchers call it the abstinence violation effect. The way out is kindness and an immediate restart: log it, learn from it, begin again right now.'],
a7t:['خواب، ورزش، دوش سرد و خستگی','Sleep, exercise, cold showers and fatigue'],a7b:['خواب کافی و حرکت منظم خلق و کنترل تکانه را پایدار می‌کنند و خستگی از بزرگ‌ترین دشمنان خودکنترلی است. دوش سرد فقط می‌تواند حواس را فوری عوض کند؛ آن را ابزار حواس‌پرتی بدان، نه معجزه.','Enough sleep and regular movement steady mood and impulse control, and fatigue is one of the biggest drains on self-control. A cold shower can shift your attention quickly; treat it as a distraction tool, not a miracle.'],
a8t:['پاک‌سازی گام‌به‌گام فید شبکه‌های اجتماعی','Cleaning your social feeds step by step'],a8b:['۱) حساب‌های محرک را آنفالو یا بلاک کن. ۲) پخش خودکار و محتوای حساس را خاموش کن. ۳) کلمات را میوت کن. ۴) در Screen Time فیلتر محتوا بگذار. ۵) هفته‌ای یک بار فید را مرور کن.','1) Unfollow or block triggering accounts. 2) Turn off autoplay and sensitive content. 3) Mute keywords. 4) Set content filters in Screen Time. 5) Review your feed once a week.']
};
const LINES=[['امروز فقط همین امروز را در نظر بگیر.','Today is the only day you need to handle.'],['میل می‌آید و می‌رود؛ تو می‌مانی.','Urges come and go; you stay.'],['یک نفس عمیق، یک قدم کوچک.','One deep breath, one small step.'],['لازم نیست کامل باشی، فقط ادامه بده.','You do not need to be perfect, just keep going.'],['خستگی با میل اشتباه گرفته می‌شود؛ اول استراحت.','Tiredness disguises itself as desire; rest first.'],['محیطت را امروز کمی آسان‌تر کن.','Make your environment a little easier today.'],['هر موجی که بگذرد تو را قوی‌تر می‌کند.','Every wave you let pass makes you steadier.'],['گوشی را بیرون از تخت بگذار؛ شب راحت‌تر می‌شود.','Keep the phone out of bed; the night gets easier.'],['با خودت مثل دوستی که دوستش داری رفتار کن.','Treat yourself like a friend you care about.'],['لغزش یک داده است، نه حکم.','A slip is data, not a verdict.'],['به جای جنگیدن، تماشا کن.','Instead of fighting, observe.'],['چیزی که الان حس می‌کنی موقتی است.','What you feel right now is temporary.'],['یک کار کوچک و محافظ برای امروز انتخاب کن.','Pick one small protective action for today.'],['پیشرفت ساکت است، ولی واقعی.','Progress is quiet, but real.'],['امروز کمی بیرون برو؛ هوا تازه کمک می‌کند.','Step outside today; fresh air helps.'],['به آدم‌ها نزدیک شو؛ تنهایی میل را بلندتر می‌کند.','Move toward people; loneliness turns the urge louder.'],['خوب بخواب؛ فردا را آسان‌تر می‌کند.','Sleep well; it makes tomorrow easier.'],['دلیل‌هایت را بخوان و یادت بیاید چرا شروع کردی.','Read your reasons and remember why you began.'],['عادت‌ها با تکرار ساخته می‌شوند و با تکرار عوض می‌شوند.','Habits are built by repetition and changed by repetition.'],['آرام و پیوسته؛ همین کافی است.','Calm and steady; that is enough.']];
const EX=[['اگر در تخت با گوشی بودم، آنگاه گوشی را بیرون اتاق می‌گذارم.','If I am in bed with my phone, then I will put it outside the room.'],['اگر به حمام رفتم، آنگاه گوشی را همراهم نمی‌برم.','If I go to the bathroom, then I will leave my phone outside.'],['اگر حس کسالت کردم، آنگاه ۵ دقیقه بیرون قدم می‌زنم.','If I feel bored, then I will walk outside for 5 minutes.'],['اگر حس تنهایی کردم، آنگاه به یک دوست پیام می‌دهم.','If I feel lonely, then I will message a friend.'],['اگر محتوای تحریک‌کننده دیدم، آنگاه بلافاصله می‌بندم و گوشی را قفل می‌کنم.','If I see triggering content, then I will close it immediately and lock my phone.'],['اگر میل شدید شد، آنگاه دکمهٔ SOS را می‌زنم.','If the urge gets strong, then I will press SOS.'],['اگر خسته بودم، آنگاه به‌جای گوشی می‌خوابم.','If I am tired, then I will sleep instead of scrolling.'],['اگر استرس داشتم، آنگاه ۱۰ نفس آرام می‌کشم و آب سرد به صورتم می‌زنم.','If I am stressed, then I will take 10 slow breaths and splash cold water on my face.'],['اگر بعد از ساعت ۱۱ شب بیدار بودم، آنگاه گوشی را شارژ می‌گذارم.','If I am awake after 11 pm, then I will put the phone on charge.'],['اگر تنها در خانه بودم، آنگاه در فضای مشترک می‌مانم.','If I am home alone, then I will stay in a shared space.']];
